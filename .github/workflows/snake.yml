name: generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # Two ramps, both amber. The dark one's empty cell is near-black, which on a
      # light-theme profile would render the whole grid as a solid black brick.
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f2b54a&color_dots=#1f1913,#683b18,#985b1a,#c7852a,#f2b54a
            dist/snake-light.svg?color_snake=#c7852a&color_dots=#f0e9dc,#f0d9a8,#e6b767,#d0912f,#a86a1d

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
